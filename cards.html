<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Us❤️</title>
  </head>
  <body>
    <!-- PLAY AUDIO -->
     <audio class="song" autoplay loop>
      <source src="flower.mp3" type="audio/mpeg">
      Your browser does not support the audio element.
     </audio>

    <!-- LOAD CARDS -->
    <div class="cards-container">

      <!-- SWIPE BUTTON -->
      <div >
        <button class="swipe-right">&gt;</button>
        <button class="swipe-left">&lt;</button>
      </div>

      <!-- CARDS -->
      <div class="cards">
        <img src="2025-03-10.png" id="first" alt="LE CARD">
        <img src="2025-03-15.png" alt="LE CARD">
        <img src="2025-04-10.png" alt="LE CARD">
        <img src="2025-05-16-concert.png" alt="LE CARD">
        <img src="2025-05-16-prom.png" alt="LE CARD">
        <img src="2025-06-23.png" alt="LE CARD">
        <img src="2025-06-24.png" alt="LE CARD">
        <img src="2025-07-13.png" alt="LE CARD">
        <img src="2025-07-26.png" alt="LE CARD">
        <img src="2026-01-02.png" alt="LE CARD">
        <img src="2026-02-14.png" id="last" alt="LE CARD">
      </div>

      <!-- DARKEN EFFECT -->
       <div id="darken"></div>

       <!-- MESSAGE -->
        <h1 id="message">I can't believe its been a year already... This was probably the hardest year of my life, and yet you also made it the best. I can't wait to make more memories with you. I love you.</h1>
        <img src="flower.png" id="flower" alt="flower">
    </div>
    <script type="module" src="/src/cards.js"></script>
  </body>
</html>
